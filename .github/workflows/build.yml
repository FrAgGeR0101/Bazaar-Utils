name: Run Gradle Build

on:
  push:
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17          # ①  install a modern LTS JDK
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'         #   (≥16 satisfies pack200)

      - name: Build with Gradle      # ②  force Gradle to use it
        env:
          JAVA_HOME: ${{ steps.jdk.outputs.java-home }}
        run: ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar

