name: Run Gradle Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8          
        id: jdk
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build with Gradle     
        env:
          JAVA_HOME: ${{ steps.jdk.outputs.java-home }}
        run: ./gradlew setupDecompWorkspace build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
